name: build-and-release

# main への push / PR: リリース APK をビルドして Artifacts に保存
# v* タグの push: 署名付き APK を GitHub Release に添付
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle のキャッシュと gradle-wrapper.jar の検証
      - uses: gradle/actions/setup-gradle@v4

      - name: Decide version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # Secrets に署名鍵があれば復元する（PR やフォークでは Secrets が無いので署名なしでビルド）
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵の Secrets がないため、署名なしでビルドします"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$VERSION_CODE" --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/NfcUrlShare-$VERSION.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/NfcUrlShare-$VERSION-unsigned.apk"
          fi
          ls -l dist

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: NfcUrlShare-${{ env.VERSION }}
          path: dist/*.apk

      - name: Require signed APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f "dist/NfcUrlShare-$VERSION.apk" ]; then
            echo "::error::タグのリリースには署名鍵の Secrets が必要です（tools/setup-release-signing.ps1）"
            exit 1
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NfcUrlShare-${{ env.VERSION }}.apk
          generate_release_notes: true
